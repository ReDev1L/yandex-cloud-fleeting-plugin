default:
  tags:
    - gitlab-org

variables:
  GOLANG_IMAGE: golang:1.20
  CGO_ENABLED: 0
  OUT_PATH: out
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/releases"

.go-cache:
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
  before_script:
  - mkdir -p "${GOCACHE}"
  cache:
    paths:
    - $CI_PROJECT_DIR/.gocache/
    key: "${CI_JOB_NAME_SLUG}"


stages:
  - build
  - upload
  - release
  
binaries:
  stage: build
  script: 
    - make all
  artifacts:
    paths:
      - ${OUT_PATH}/${CI_PROJECT_NAME}-*
  parallel:
    matrix:
    - OS_ARCHS:
      - darwin/amd64 darwin/arm64
      - freebsd/amd64 freebsd/arm64
      - linux/amd64 linux/arm64
      - windows/amd64.exe windows/386.exe
  needs: []

upload-binaries:
  stage: upload
  image: alpine:latest
  dependencies:
    - binaries
  script:
    - apk add curl gnupg make
    - make upload-release
  environment:
    name: upload
  artifacts:
    paths:
      - manifest.txt

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - upload-binaries
  script:
    - apk add make bash curl
    - make release

